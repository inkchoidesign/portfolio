<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영어 3개월</title>
<style>
:root{
  --bg:#E2E0DB; --panel:#F3F2EE; --panel2:#D5D2CA; --line:#C3BFB6;
  --text:#171B21; --text2:#5B606A; --dim:#8B8880;
  --amber:#9C6100; --amberSolid:#E09B2D; --amberSoft:#F5E3C4;
  --signal:#B23A16; --jade:#2C7355; --jadeSoft:#D3E5DC;
  --shadow:0 1px 0 rgba(0,0,0,.06),0 6px 18px -10px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12161C; --panel:#1B212A; --panel2:#242C38; --line:#333C48;
  --text:#EDEFF2; --text2:#98A1AD; --dim:#5A6472;
  --amber:#E09B2D; --amberSolid:#E09B2D; --amberSoft:#3A2E17;
  --signal:#E4572E; --jade:#3F9E7A; --jadeSoft:#1B3129;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 24px -14px #000;
}}
:root[data-theme="dark"]{
  --bg:#12161C; --panel:#1B212A; --panel2:#242C38; --line:#333C48;
  --text:#EDEFF2; --text2:#98A1AD; --dim:#5A6472;
  --amber:#E09B2D; --amberSolid:#E09B2D; --amberSoft:#3A2E17;
  --signal:#E4572E; --jade:#3F9E7A; --jadeSoft:#1B3129;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 24px -14px #000;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",Segoe UI,Roboto,sans-serif;
  -webkit-text-size-adjust:100%; line-height:1.5;
}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.cond{font-family:"Avenir Next Condensed","Helvetica Neue",-apple-system,sans-serif}
.lbl{font:600 10px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
.wrap{max-width:460px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--amberSolid);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- status bar ---- */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px;
  border-bottom:1px solid var(--line);margin-bottom:2px}
.barTop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.streak{display:flex;align-items:baseline;gap:6px}
.streak b{font:700 22px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--signal)}
.streak.zero b{color:var(--dim)}
.dayNo{font:700 13px/1 ui-monospace,Menlo,monospace;color:var(--text2);font-variant-numeric:tabular-nums}
.gauge{display:flex;gap:2px;height:12px;align-items:stretch}
.gaugeGrp{display:flex;gap:1.5px;flex:1}
.tick{flex:1;background:var(--panel2);border-radius:1px}
.tick.on{background:var(--amberSolid)}
.tick.min{background:var(--amberSoft);box-shadow:inset 0 0 0 1px var(--amberSolid)}
.tick.now{background:var(--signal)}

/* ---- cards ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.hazard{height:5px;background:repeating-linear-gradient(-45deg,var(--amberSolid) 0 7px,transparent 7px 14px);opacity:.9}
.pad{padding:16px}
.mission{display:flex;flex-direction:column;gap:14px}
.mHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mBig{font:700 30px/1.05 -apple-system,"Avenir Next Condensed",sans-serif;letter-spacing:-.01em}
.mSub{color:var(--text2);font-size:13px;margin-top:5px}
.chip{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 8px;border-radius:999px;background:var(--panel2);color:var(--text2);white-space:nowrap}
.chip.done{background:var(--jadeSoft);color:var(--jade)}
.chip.boss{background:var(--amberSoft);color:var(--amber)}
.btn{display:block;width:100%;padding:15px;border-radius:8px;background:var(--amberSolid);color:#1A1206;
  font-weight:700;font-size:16px;text-align:center;transition:filter .15s}
.btn:hover{filter:brightness(1.06)} .btn:active{filter:brightness(.94)}
.btn.ghost{background:transparent;color:var(--text2);border:1px solid var(--line);font-weight:600;font-size:14px;padding:12px}
.btn.ghost:hover{background:var(--panel2);filter:none}
.btn.jade{background:var(--jade);color:#fff}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.row{display:flex;gap:8px}.row>*{flex:1}
.voa{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);
  background:var(--panel2);text-decoration:none;color:inherit}
.voa:hover{filter:brightness(.98)}
.voaT{flex:1;min-width:0}
.voaT div:first-child{font-size:11px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.voaT div:last-child{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* ---- study ---- */
.top{display:flex;align-items:center;gap:12px;padding:12px 0}
.back{font-size:20px;line-height:1;color:var(--text2);padding:4px 8px;margin-left:-8px}
.prog{flex:1;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
.progIn{height:100%;background:var(--amberSolid);border-radius:2px;transition:width .25s}
.cnt{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--text2)}
.word{padding:26px 20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.wTop{display:flex;align-items:center;gap:10px;width:100%}
.wEn{font:700 32px/1.15 -apple-system,sans-serif;letter-spacing:-.02em;word-break:break-word;flex:1}
.spk{width:38px;height:38px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;flex:none}
.spk:hover{background:var(--amberSoft)}
.wKo{font-size:17px;color:var(--amber);font-weight:600}
.wNum{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--dim);letter-spacing:.1em}
.ex{border-top:1px solid var(--line);padding:14px 20px;display:flex;flex-direction:column;gap:9px}
.ex p{margin:0;font-size:14.5px;color:var(--text2)}
.ex p b{color:var(--text);font-weight:600}
.rvTag{align-self:flex-start;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;
  text-transform:uppercase;padding:4px 7px;border-radius:3px;background:var(--amberSoft);color:var(--amber)}

/* ---- quiz ---- */
.q{padding:22px 20px;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.qHint{font-size:12px;color:var(--text2);letter-spacing:.04em}
.qMain{font:700 23px/1.35 -apple-system,sans-serif;word-break:break-word}
.qMain em{font-style:normal;color:var(--amber);background:var(--amberSoft);padding:1px 6px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:14px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
  font-size:16px;font-weight:600;transition:background .12s,border-color .12s;display:flex;justify-content:space-between;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--amberSolid)}
.opt.right{background:var(--jadeSoft);border-color:var(--jade);color:var(--jade)}
.opt.wrong{background:var(--amberSoft);border-color:var(--signal);color:var(--signal)}
.opt:disabled{cursor:default}
.mark{font:700 13px/1 ui-monospace,Menlo,monospace}
.dots{display:flex;gap:3px;flex-wrap:wrap;flex:1;align-content:center}
.dot{width:100%;height:3px;border-radius:2px;background:var(--panel2);flex:1;min-width:2px}
.dot.ok{background:var(--jade)} .dot.no{background:var(--signal)}

/* ---- result ---- */
.res{padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.stamp{font:700 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;
  padding:9px 16px;border:2px solid currentColor;border-radius:5px;transform:rotate(-3deg);margin-bottom:12px}
.stamp.full{color:var(--jade)} .stamp.min{color:var(--amber)} .stamp.fail{color:var(--signal)}
.score{font:700 54px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.score span{font-size:24px;color:var(--text2)}
.resMsg{font-size:14px;color:var(--text2);max-width:30ch;margin-top:6px}
.gain{display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);width:100%;justify-content:center}
.gain div{text-align:center}
.gain b{display:block;font:700 20px/1 ui-monospace,Menlo,monospace;color:var(--amber)}
.gain span{font-size:10.5px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;font-weight:600}

/* ---- map / chart ---- */
.secT{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.wk{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:none}
.wkN{font:700 11px/1 ui-monospace,Menlo,monospace;color:var(--text2);width:34px;flex:none}
.cells{display:flex;gap:4px;flex:1}
.cell{flex:1;min-width:0;height:26px;border-radius:4px;background:var(--panel2);display:grid;place-items:center;
  font:700 10px/1 ui-monospace,Menlo,monospace;color:var(--dim);overflow:hidden}
.cell.on{background:var(--amberSolid);color:#1A1206}
.cell.min{background:var(--amberSoft);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amberSolid)}
.cell.now{background:transparent;box-shadow:inset 0 0 0 2px var(--signal);color:var(--signal)}
.bossCell{width:34px;flex:none;height:26px;border-radius:4px;background:var(--panel2);display:grid;place-items:center;
  font:700 10px/1 ui-monospace,Menlo,monospace;color:var(--dim)}
.bossCell.on{background:var(--jade);color:#fff}
.bossCell.rdy{background:var(--signal);color:#fff}
.mBadges{display:flex;gap:8px}
.badge{flex:1;padding:11px 8px;border-radius:8px;background:var(--panel2);text-align:center;opacity:.45}
.badge.on{opacity:1;background:var(--jadeSoft)}
.badge b{display:block;font:700 12px/1.3 -apple-system,sans-serif;color:var(--text)}
.badge span{font-size:10px;color:var(--text2)}
.empty{padding:26px 16px;text-align:center;color:var(--text2);font-size:13.5px}
.foot{text-align:center;font-size:11.5px;color:var(--dim);padding:10px 0 0;line-height:1.7}
a.lnk{color:var(--amber);text-decoration:none;border-bottom:1px solid currentColor}
</style>
<div class="bar">
  <div class="wrap" style="padding-bottom:0;gap:8px">
    <div class="barTop">
      <div class="streak" id="stk">
        <svg width="15" height="18" viewBox="0 0 15 18" fill="none" aria-hidden="true"><path d="M7.5 1S3 5 3 9a4.5 4.5 0 0 0 9 0c0-1.5-1-3-1-3s-.5 1.5-1.5 1.5S7.5 5.5 7.5 1Z" fill="currentColor"/></svg>
        <b>0</b><span class="lbl" style="color:var(--text2)">일 연속</span>
      </div>
      <div class="dayNo" id="dayNo">DAY 0 / 60</div>
    </div>
    <div class="gauge" id="gauge" aria-label="60일 진도"></div>
  </div>
</div>
<div class="wrap" id="app"></div>

,"Let me confirm that for you."]},{"n":20,"w":"arrange","k":"준비하다/정리하다","ex":["I arranged everything already.","Let's arrange a time to meet."]}]},{"day":3,"voa":{"lesson":1,"how":"반복 + 따라 말하기"},"theme":null,"words":[{"n":21,"w":"handle","k":"처리하다","ex":["I can handle it.","How do you handle stress?"]},{"n":22,"w":"mention","k":"언급하다","ex":["He didn't mention the price.","As I mentioned before..."]},{"n":23,"w":"assume","k":"추측하다","ex":["I assumed you were busy.","Don't assume anything."]},{"n":24,"w":"rely","k":"의존하다","ex":["I rely on this app.","You can rely on me."]},{"n":25,"w":"struggle","k":"고생하다/애쓰다","ex":["I struggled with English at first.","She's struggling to find the place."]},{"n":26,"w":"achieve","k":"성취하다","ex":["I achieved my goal.","What did you achieve today?"]},{"n":27,"w":"increase","k":"증가하다","ex":["Traffic increased this week.","Prices will increase soon."]},{"n":28,"w":"reduce","k":"줄이다","ex":["I want to reduce mistakes.","This will reduce the time."]},{"n":29,"w":"occur","k":"발생하다","ex":["The error occurred yesterday.","It occurs often in winter."]},{"n":30,"w":"respond","k":"응답하다","ex":["Please respond quickly.","He didn't respond to my message."]}]},{"day":4,"voa":{"lesson":2,"how":"처음 듣기"},"theme":null,"words":[{"n":31,"w":"appreciate","k":"감사하다","ex":["I appreciate your help.","Thank you, I really appreciate it."]},{"n":32,"w":"clarify","k":"명확히 하다","ex":["Can you clarify that?","Let me clarify the situation."]},{"n":33,"w":"resolve","k":"해결하다","ex":["We resolved the issue.","I need to resolve this today."]},{"n":34,"w":"maintain","k":"유지하다","ex":["I try to maintain a schedule.","It's hard to maintain focus."]},{"n":35,"w":"communicate","k":"소통하다","ex":["We communicate mostly by text.","It's easier to communicate now."]},{"n":36,"w":"responsibility","k":"책임","ex":["It's my responsibility.","Whose responsibility is this?"]},{"n":37,"w":"opportunity","k":"기회","ex":["This is a good opportunity.","I didn't get the opportunity."]},{"n":38,"w": e __________ feedback.","a":"genuine","k":"진실된"},{"n":595,"q":"I'm __________ for this opportunity.","a":"grateful","k":"감사하는"},{"n":596,"q":"I'm __________ with my progress.","a":"content","k":"만족하는"},{"n":597,"q":"This course is __________.","a":"worthwhile","k":"가치 있는"},{"n":598,"q":"This was a __________ conversation.","a":"meaningful","k":"의미 있는"},{"n":599,"q":"This job feels __________.","a":"fulfilling","k":"성취감을 주는"},{"n":600,"q":"It's __________ to see progress.","a":"rewarding","k":"보람 있는"}]}],"months":[{"n":1,"title":"영어의 기본 뼈대"},{"n":2,"title":"배달 · 지게차/중장비 · 캐나다 생활"},{"n":3,"title":"대화 수준 올리기 · 문장 연결"}]}, VOA={"1":["Welcome!","https://learningenglish.voanews.com/a/lets-learn-english-lesson-one/3111026.html"],"2":["Hello, I'm Anna!","https://learningenglish.voanews.com/a/lets-learn-english-lesson-2-hello/3113733.html"],"3":["I'm Here!","https://learningenglish.voanews.com/a/lets-learn-english-lesson-3-i-am-here/3126527.html"],"4":["What Is It?","https://learningenglish.voanews.com/a/lets-learn-english-lesson-4/3168920.html"],"5":["Where Are You?","https://learningenglish.voanews.com/a/lets-learn-english-lesson-5-where-are-you/3168971.html"],"6":["Where Is the Gym?","https://learningenglish.voanews.com/a/lets-learn-english-lesson-6-where-is-the-gym/3225958.html"],"7":["What Are You Doing?","https://learningenglish.voanews.com/a/lets-learn-english-lesson-7-what-are-you-doing/3240468.html"],"8":["Are You Busy?","https://learningenglish.voanews.com/a/lets-learn-english-lesson-8-are-you-busy/3253185.html"],"9":["Is It Cold?","https://learningenglish.voanews.com/a/lets-learn-english-lesson-9-is-it-cold/3261789.html"],"10":["Come Over to My Place","https://learningenglish.voanews.com/a/lets-learn-english-lesson-10/3285228.html"],"11":["This Is My Neighborhood","https://learningenglish.voanews.com/a/lets-learn-english-lesson-11-this-is-my-neighborhood/3293986.html"],"12":["Meet My Family","https://learningenglish.voanews.com/a/lets-learn-english-lesson-12-meet-m const WORDS={}; D.days.forEach(d=>d.words.forEach(w=>WORDS[w.n]=w));
const P2={}; D.tests.forEach(t=>t.p2.forEach(q=>P2[q.n]=q));
const LAST=90, WEEKLEN=7, WEEKS=13, MSHORT=["기본 뼈대","현장 어휘","실전 확장"];
const dayOf=n=>Math.ceil(n/10);
const weekOfDay=d=>Math.min(WEEKS,Math.ceil(d/WEEKLEN));
const weekDays=w=>{const a=[];for(let d=(w-1)*WEEKLEN+1;d<=Math.min(LAST,w*WEEKLEN);d++)a.push(d);return a};
const monthOfDay=d=>Math.min(3,Math.ceil(d/30));
const dayNums=d=>D.days[d-1].words.map(w=>w.n);

/* ---------- state ---------- */
const KEY="eng90.v1";
const blank={cleared:{},boss:{},wrong:[],streak:0,best:0,last:"",seen:{}};
let S;
try{S=Object.assign({},blank,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=Object.assign({},blank)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ymd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
function bumpStreak(){
  const t=today(); if(S.last===t)return;
  if(S.last){const gap=Math.round((ymd(t)-ymd(S.last))/864e5);S.streak=gap===1?S.streak+1:1}else S.streak=1;
  S.last=t; if(S.streak>S.best)S.best=S.streak;
}
if(S.last){const gap=Math.round((ymd(today())-ymd(S.last))/864e5); if(gap>1)S.streak=0}
const doneDays=()=>Object.keys(S.cleared).map(Number).sort((a,b)=>a-b);
const nextDay=()=>{for(let i=1;i<=LAST;i++)if(!S.cleared[i])return i;return null};
const wordsDone=()=>doneDays().reduce((a,d)=>a+(S.cleared[d]==="min"?3:10),0);
const weekDone=w=>weekDays(w).every(d=>S.cleared[d]);

/* ---------- 매일 복습 5개 (간격 반복) ---------- */
function reviewPool(day){
  const done=doneDays().filter(d=>d<day);
  if(!done.length)return[];
  const pri=[],mid=[],old=[];
  done.forEach(d=>{const gap=day-d,arr=gap<=3?pri:gap<=7?mid:old;dayNums(d).forEach(n=>arr.push(n))});
  const wrong=S.wrong.filter(n=>dayOf(n)<day);
  const seen=n=>(S.seen[n]||0);
  const pick=[],used=new Set();
  const take=(arr,k)=>{const s=arr.slice().sort((a,b)=>seen(a)-seen(b)||a-b);
    for(const n of s){if(pick.length>=k)break;if(!used.has(n)){used.add(n);pick.push(n)}}};
  take(wrong,2);take(pri,3);take(mid,4);take(old,5);take(wrong.concat(pri,mid,old),5);
  return pick.slice(0,5);
}

/* ---------- 백업 / 복원 ---------- */
function exportCode(){
  let cl="";for(let d=1;d<=LAST;d++)cl+=S.cleared[d]==="full"?"F":S.cleared[d]==="min"?"M":".";
  let sn="";for(let n=1;n<=900;n++)sn+=String(Math.min(9,S.seen[n]||0));
  const bs=[];for(let w=1;w<=WEEKS;w++)bs.push(S.boss[w]===undefined?"":S.boss[w]);
  return["ENG90",cl,bs.join(","),S.wrong.join(","),S.streak,S.best,S.last||"",sn].join("|");
}
function importCode(code){
  const p=String(code).trim().split("|");
  if(p[0]!=="ENG90"||p.length<8)throw new Error("형식이 맞지 않습니다");
  if(p[1].length!==LAST||p[7].length!==900)throw new Error("코드가 잘렸습니다");
  const cl={};[...p[1]].forEach((c,i)=>{if(c==="F")cl[i+1]="full";else if(c==="M")cl[i+1]="min"});
  const bo={};p[2].split(",").forEach((v,i)=>{if(v!=="")bo[i+1]=+v});
  const sn={};[...p[7]].forEach((c,i)=>{const v=+c;if(v)sn[i+1]=v});
  S.cleared=cl;S.boss=bo;S.wrong=p[3]?p[3].split(",").map(Number).filter(n=>WORDS[n]):[];
  S.streak=+p[4]||0;S.best=+p[5]||0;S.last=p[6]||"";S.seen=sn;save();
}

/* ---------- quiz ---------- */
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function distract(n,k){
  const pool=Object.keys(WORDS).map(Number).filter(x=>x!==n);
  const near=pool.filter(x=>Math.abs(x-n)<=25);
  return shuffle(near.length>=k?near:pool).slice(0,k);
}
function blankFrom(w){
  if(P2[w.n])return P2[w.n].q;
  const stem=w.w.split(" ")[0].replace(/e$/,"");
  if(stem.length<3)return null;
  const re=new RegExp("\\b"+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*","i");
  for(const s of (w.ex||[])) if(re.test(s)) return s.replace(re,"__________");
  return null;
}
function makeQ(n,kind){
  const w=WORDS[n];
  if(kind==="blank"){const b=blankFrom(w);
    if(b)return{n,type:"blank",prompt:b.replace(/__________/g,"<em>____</em>"),hint:w.k,answer:w.w,
      opts:shuffle([w.w,...distract(n,3).map(x=>WORDS[x].w)])};}
  return{n,type:"ko",prompt:w.k,hint:"알맞은 영어 단어는?",answer:w.w,opts:shuffle([w.w,...distract(n,3).map(x=>WORDS[x].w)])};
}
const dayQuiz=nums=>shuffle(nums.map((n,i)=>makeQ(n,i%2?"blank":"ko")));
function bossQuiz(week){
  let nums=[];
  if(week===WEEKS){
    const first=S.wrong.slice(0,40);
    nums=first.concat(shuffle(Object.keys(WORDS).map(Number).filter(n=>!first.includes(n)))).slice(0,100);
  }else weekDays(week).forEach(d=>dayNums(d).forEach(n=>nums.push(n)));
  return shuffle(nums.map((n,i)=>makeQ(n,i%2?"blank":"ko")));
}

let VOICE=null;
function loadVoice(){const v=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang));VOICE=v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null}
if(window.speechSynthesis){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function say(t){if(!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\.\.\./g,""));
  u.lang="en-US";u.rate=.9;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u)}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  const st=document.getElementById("stk");

    </div>
    <a class="voa" href="${v.url}" target="_blank" rel="noopener">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 8v4h3l4 3V5L7 8H4Z" fill="currentColor"/><path d="M14 7a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div class="voaT"><div>차에서 들을 것 · Lesson ${v.lesson} (${esc(v.how)})</div><div>${esc(v.title)}</div></div>
      <span style="color:var(--text2);font-size:17px">›</span></a></div>`;
  }else{
    h+=`<div class="card"><div class="hazard"></div><div class="pad res">
      <div class="stamp full">3개월 완주</div><div class="score">900<span>단어</span></div>
      <p class="resMsg">90일을 전부 끝냈습니다. 이제 지게차 교육을 예약할 차례입니다.</p></div></div>`;
  }
  const rdy=[];for(let w=1;w<=WEEKS;w++)if(weekDone(w)&&S.boss[w]===undefined)rdy.push(w);
  if(rdy.length){const w=rdy[0],fin=w===WEEKS,cnt=fin?100:weekDays(w).length*10;
    h+=`<div class="card"><div class="pad mission">
      <div class="mHead"><div><div class="lbl" style="color:var(--signal)">${fin?"최종시험 해제":"주간 복습 해제"}</div>
      <div class="mBig" style="margin-top:7px;font-size:24px">${fin?"3개월 최종시험":w+"주차 복습 시험"}</div>
      <div class="mSub">${fin?"900단어 전체에서 · 약 10분":`${w}주차 ${cnt}단어 전부 · 약 7분`}</div></div>
      <div class="chip boss">${cnt}문항</div></div>
      <button class="btn jade" onclick="go('boss',{week:${w}})">${fin?"최종시험 들어가기":"복습 시험 시작"}</button></div></div>`;
  }
  h+=`<div class="card"><div class="pad" style="display:flex;flex-direction:column;gap:12px">
    <div class="secT"><span class="lbl">진행 상황</span><span class="cnt">${wordsDone()} / 900 단어</span></div>
    <div class="mBadges">${[1,2,3].map(m=>`<div class="badge ${doneDays().filter(d=>monthOfDay(d)===m).length===30?"on":""}">
      <b>${m}개월차</b><span>${esc(MSHORT[m-1])}</span></div>`).join("")}</div>
    <button class="btn ghost" onclick="go('book')">단어장 — 지나온 단어 다시 보기</button>
    <button class="btn ghost" onclick="go('map')">3개월 지도 · 시험 점수 보기</button></div></div>
    <p class="foot">기록은 이 폰에만 저장됩니다.<br>공유 · 홈 화면에 추가 하면 앱처럼 씁니다.</p>`;
  app().innerHTML=h;
}

function study(){
  const {day,mode}=view;
  const base=dayNums(day);
  const nums=mode==="min"?base.slice(0,3):base.concat(reviewPool(day));
  view.nums=nums; view.i=view.i||0;
  const i=view.i,n=nums[i],w=WORDS[n],isRv=i>=(mode==="min"?3:10);
  app().innerHTML=`<div class="top">
      <button class="back" onclick="go('home')" aria-label="뒤로">‹</button>
      <div class="prog"><div class="progIn" style="width:${(i/nums.length)*100}%"></div></div>
      <span class="cnt">${i+1}/${nums.length}</span></div>
    <div class="card"><div class="word">
      ${isRv?'<span class="rvTag">복습</span>':""}
      <span class="wNum">NO. ${n}</span>
      <div class="wTop"><div class="wEn">${esc(w.w)}</div>
        <button class="spk" onclick="say(${JSON.stringify(w.w)})" aria-label="발음 듣기">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M4 8v4h3l4 3V5L7 8H4Z" fill="currentColor"/><path d="M14 7a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button></div>
      <div class="wKo">${esc(w.k)}</div></div>
      <div class="ex">${(w.ex||[]).map(e=>`<p>${hl(e,w.w)}</p>`).join("")}</div></div>
    <button class="btn" onclick="nextCard()">${i===nums.length-1?"퀴즈 풀기":"다음"}</button>
    ${i>0?'<button class="btn ghost" onclick="view.i--;render()">이전</button>':""}`;
  S.seen[n]=(S.seen[n]||0)+1;
}
function hl(sent,w){
  const stem=w.split(" ")[0].replace(/e$/,"");
  if(stem.length<3)return esc(sent);
  const re=new RegExp("\\b("+stem.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","ig");
  return esc(sent).replace(re,"<b>$1</b>");
}
function nextCard(){
  if(view.i<view.nums.length-1){view.i++;render()}
  else go("quiz",{day:view.day,mode:view.mode,qs:dayQuiz(view.nums),i:0,ok:0,marks:[],miss:[]});
}

function quiz(){
  const q=view.qs[view.i];
  app().innerHTML=`<div class="top">
      <button class="back" onclick="if(confirm('나가면 이번 진행은 저장되지 않습니다.'))go('home')" aria-label="뒤로">‹</button>
      <div class="dots">${view.qs.map((_,k)=>`<div class="dot ${view.marks[k]===1?"ok":view.marks[k]===0?"no":""}"></div>`).join("")}</div>
      <span class="cnt">${view.i+1}/${view.qs.length}</span></div>
    <div class="card"><div class="q">
      <div class="qHint">${q.type==="blank"?"빈칸에 들어갈 단어":esc(q.hint)}</div>
      <div class="qMain">${q.type==="blank"?q.prompt:esc(q.prompt)}</div>
      ${q.type==="blank"?`<div class="qHint" style="margin-top:4px">힌트 · ${esc(q.hint)}</div>`:""}
    </div></div>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt" onclick="answer(${k})"><span>${esc(o)}</span><span class="mark"></span></button>`).join("")}</div>`;
}
function answer(k){
  const q=view.qs[view.i],right=q.opts[k]===q.answer;
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;
    if(q.opts[j]===q.answer){b.classList.add("right");b.querySelector(".mark").textContent="정답"}
    else if(j===k){b.classList.add("wrong");b.querySelector(".mark").textContent="오답"}});
  view.marks[view.i]=right?1:0;
  if(right){view.ok++;S.wrong=S.wrong.filter(x=>x!==q.n)}
  else{view.miss.push(q.n);if(!S.wrong.includes(q.n))S.wrong.push(q.n)}
  say(q.answer);
  setTimeout(()=>{if(view.i<view.qs.length-1){view.i++;render()}else finish()},right?620:1250);
}
function finish(){
  if(view.s==="bossq"){
    const sc=Math.round(view.ok/view.qs.length*100);
    S.boss[view.week]=sc;bumpStreak();save();
    go("bossr",{week:view.week,score:sc,ok:view.ok,total:view.qs.length,miss:view.miss});
  }else{
    const pass=view.ok>=Math.ceil(view.qs.length*.6),kind=view.mode==="min"?"min":"full";
    if(pass){S.cleared[view.day]=kind;bumpStreak()}
    save();
    go("result",{day:view.day,ok:view.ok,total:view.qs.length,pass,kind,miss:view.miss});
  }
}
const missList=(m,note)=>m.length?`<div class="card"><div class="pad" style="display:flex;flex-direction:column;gap:10px">
  <span class="lbl">틀린 단어 ${m.length}개${note||""}</span>
  ${m.slice(0,60).map(n=>`<div style="display:flex;justify-content:space-between;gap:12px;font-size:14.5px">
    <b>${esc(WORDS[n].w)}</b><span style="color:var(--text2)">${esc(WORDS[n].k)}</span></div>`).join("")}
  </div></div>`:"";
function result(){
  const {ok,total,pass,kind,day}=view,miss=view.miss||[];
  const st=!pass?"fail":kind==="min"?"min":"full";
  const txt=!pass?"다시 도전":kind==="min"?"최소 클리어":"미션 클리어";
  const msg=!pass?"6할을 못 넘었습니다. 카드를 한 번 더 보고 다시 풀면 통과됩니다."
    :kind==="min"?"3개만 했지만 오늘도 한 날입니다. 연속 기록이 이어졌습니다."
    :day+"일차 완료. 틀린 단어는 다음 복습에 자동으로 다시 나옵니다.";
  app().innerHTML=`<div class="card"><div class="hazard"></div><div class="res">
      <div class="stamp ${st}">${txt}</div><div class="score">${ok}<span>/${total}</span></div>
      <p class="resMsg">${msg}</p>
      ${pass?`<div class="gain"><div><b>${S.streak}</b><span>일 연속</span></div>
        <div><b>${wordsDone()}</b><span>누적 단어</span></div>
        <div><b>${doneDays().length}</b><span>클리어 일수</span></div></div>`:""}
    </div></div>${missList(miss)}
    ${pass?`<button class="btn" onclick="go('home')">계속</button>`
      :`<button class="btn" onclick="go('study',{day:${day},mode:'${kind}',i:0})">다시 하기</button>
        <button class="btn ghost" onclick="go('home')">나중에</button>`}`;
}
function bossIntro(){
  const w=view.week,fin=w===WEEKS,cnt=fin?100:weekDays(w).length*10,dd=weekDays(w);
  app().innerHTML=`<div class="top"><button class="back" onclick="go('home')" aria-label="뒤로">‹</button>
      <span class="cnt" style="flex:1">${fin?"최종시험":w+"주차 복습 시험"}</span></div>
    <div class="card"><div class="hazard"></div><div class="res">
      <div class="lbl">${fin?"FINAL":"WEEK "+w}</div>
      <div class="score" style="margin:6px 0">${cnt}<span>문항</span></div>
      <p class="resMsg">${fin?"3개월 동안 배운 900단어 전체에서 100문항이 나옵니다. 자주 틀린 단어가 먼저 나옵니다."
        :`${dd[0]}~${dd[dd.length-1]}일차에 배운 ${cnt}단어 전부가 나옵니다.`} 중간에 나가면 점수가 남지 않습니다.</p>
      <p class="resMsg" style="color:var(--amber)">60점을 넘기는 것이 목표입니다.</p></div></div>
    <button class="btn jade" onclick="go('bossq',{week:${w},qs:bossQuiz(${w}),i:0,ok:0,marks:[],miss:[]})">시작</button>`;
}
function bossResult(){
  const {week,score,ok,total}=view,miss=view.miss||[];
  const prev=Object.keys(S.boss).map(Number).filter(w=>w<week).sort((a,b)=>b-a)[0];
  const st=score>=80?"full":score>=60?"min":"fail";
  app().innerHTML=`<div class="card"><div class="hazard"></div><div class="res">
      <div class="stamp ${st}">${score>=80?"우수":score>=60?"통과":"재도전 권장"}</div>
      <div class="score">${score}<span>점</span></div>
      <p class="resMsg">${ok} / ${total} 정답${prev?` · ${prev}주차 ${S.boss[prev]}점 대비 ${score-S.boss[prev]>=0?"+":""}${score-S.boss[prev]}점`:""}</p>
      <div class="gain"><div><b>${S.streak}</b><span>일 연속</span></div>
      <div><b>${S.wrong.length}</b><span>오답 누적</span></div></div></div></div>
    ${missList(miss," — 복습에 자동 편성됩니다")}
    <button class="btn" onclick="go('home')">계속</button>`;
}
function map(){
  const nd=nextDay();
  let h=`<div class="top"><button class="back" onclick="go('home')" aria-label="뒤로">‹</button>
    <span class="cnt" style="flex:1">3개월 · 90일 · 900단어</span></div>
    <div class="card"><div class="pad" style="padding:12px 14px">`;
  for(let w=1;w<=WEEKS;w++){
    h+=`<div class="wk"><span class="wkN">${w}주</span><div class="cells">`;
    weekDays(w).forEach(d=>{const c=S.cleared[d];
      h+=`<div class="cell ${c==="full"?"on":c==="min"?"min":d===nd?"now":""}">${d}</div>`});
    for(let k=weekDays(w).length;k<WEEKLEN;k++)h+=`<div style="flex:1"></div>`;
    h+=`</div><div class="bossCell ${S.boss[w]!==undefined?"on":weekDone(w)?"rdy":""}">${S.boss[w]!==undefined?S.boss[w]:weekDone(w)?"!":"–"}</div></div>`;
  }
  h+=`</div></div>`;
  const bs=Object.keys(S.boss).map(Number).sort((a,b)=>a-b);
  h+=`<div class="card"><div class="pad" style="display:flex;flex-direction:column;gap:12px">
    <div class="secT"><span class="lbl">복습 시험 점수</span><span class="cnt">${bs.length}/${WEEKS}</span></div>`;
  if(bs.length){h+=`<div style="display:flex;align-items:flex-end;gap:4px;height:80px">`;
    for(let w=1;w<=WEEKS;w++){const s=S.boss[w];
      h+=`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%">
        <span class="mono" style="font-size:9px;color:var(--text2)">${s!==undefined?s:""}</span>
        <div style="width:100%;height:${s!==undefined?Math.max(4,s*.6):2}px;border-radius:2px;background:${s!==undefined?"var(--amberSolid)":"var(--panel2)"}"></div>
        <span class="mono" style="font-size:8.5px;color:var(--dim)">${w}</span></div>`}
    h+=`</div>`;
  }else h+=`<p class="empty" style="padding:12px 0">7일을 클리어하면 첫 복습 시험이 열립니다.</p>`;
  h+=`</div></div>
  <div class="card"><div class="pad" style="display:flex;flex-direction:column;gap:10px">
    <div class="secT"><span class="lbl">진도 백업</span><span class="cnt">${doneDays().length}일 · ${wordsDone()}단어</span></div>
    <p style="margin:0;font-size:12.5px;color:var(--text2);line-height:1.6">폰을 바꾸거나 기록이 사라졌을 때를 대비해, 아래 코드를 메모앱에 붙여넣어 두세요. 가끔 한 번만 하면 됩니다.</p>
    <textarea id="bkOut" readonly rows="2" style="width:100%;font:11px/1.5 ui-monospace,Menlo,monospace;padding:9px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text2);resize:none">${esc(exportCode())}</textarea>
    <button class="btn ghost" onclick="copyBk(this)">백업 코드 복사</button>
    <details><summary style="font-size:13px;color:var(--text2);cursor:pointer">저장해 둔 코드로 복원하기</summary>
      <textarea id="bkIn" rows="2" placeholder="백업 코드를 여기에 붙여넣으세요" style="width:100%;margin-top:9px;font:11px/1.5 ui-monospace,Menlo,monospace;padding:9px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);resize:none"></textarea>
      <button class="btn ghost" style="margin-top:8px" onclick="doRestore()">이 코드로 복원</button>
      <p id="bkMsg" style="margin:8px 0 0;font-size:12.5px;min-height:1em"></p></details>
  </div></div>
  <div class="card"><div class="pad" style="display:flex;flex-direction:column;gap:10px">
    <div class="secT"><span class="lbl">오답 누적</span><span class="cnt">${S.wrong.length}개</span></div>
    ${S.wrong.length?S.wrong.slice(-40).reverse().map(n=>`<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px">
      <b>${esc(WORDS[n].w)}</b><span style="color:var(--text2)">${esc(WORDS[n].k)}</span></div>`).join("")
      :`<p class="empty" style="padding:8px 0">아직 없습니다.</p>`}
  </div></div>
  <button class="btn ghost" onclick="if(confirm('모든 기록이 지워집니다. 계속할까요?')){localStorage.removeItem('eng90.v1');location.reload()}">기록 전체 초기화</button>`;
  app().innerHTML=h;
}
function book(){
  const nd=nextDay()||LAST+1, open=view.open||null, q=(view.q||"").trim().toLowerCase();
  let h=`<div class="top"><button class="back" onclick="go('home')" aria-label="뒤로">‹</button>
    <span class="cnt" style="flex:1">단어장</span></div>
    <div class="card"><div class="pad" style="padding:12px 14px">
      <input id="bkq" type="search" value="${esc(view.q||"")}" placeholder="영어 단어나 한글 뜻으로 찾기"
        oninput="view.q=this.value;view.open=null;render();const el=document.getElementById('bkq');el.focus();el.setSelectionRange(el.value.length,el.value.length)"
        style="width:100%;padding:11px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:15px/1.3 inherit">
    </div></div>`;
  const card=w=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;align-items:baseline;gap:8px">
        <b style="font-size:16.5px">${esc(w.w)}</b>
        <span style="color:var(--amber);font-size:13.5px;font-weight:600">${esc(w.k)}</span>
        <span style="flex:1"></span>
        <button class="spk" style="width:28px;height:28px" onclick="say(${JSON.stringify(w.w)})" aria-label="발음 듣기">
          <svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M4 8v4h3l4 3V5L7 8H4Z" fill="currentColor"/><path d="M14 7a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button></div>
      ${(w.ex||[]).map(x=>`<p style="margin:4px 0 0;font-size:13.2px;color:var(--text2)">${hl(x,w.w)}</p>`).join("")}
    </div>`;
  if(q){
    const hits=[];
    for(let d=1;d<nd;d++)D.days[d-1].words.forEach(w=>{
      if(w.w.toLowerCase().includes(q)||w.k.includes(q))hits.push([d,w])});
    h+=`<div class="card"><div class="pad" style="padding:4px 14px 12px">
      <div class="secT" style="margin:10px 0 2px"><span class="lbl">검색 결과</span><span class="cnt">${hits.length}개</span></div>
      ${hits.length?hits.slice(0,80).map(([d,w])=>card(w)+`<div style="margin:-9px 0 0;font-size:10.5px;color:var(--dim)">${d}일차 · NO.${w.n}</div>`).join("")
        :`<p class="empty">아직 배우지 않았거나 없는 단어입니다.</p>`}
    </div></div>`;
    app().innerHTML=h; return;
  }
  h+=`<div class="card"><div class="pad" style="padding:6px 14px 10px">`;
  for(let m=1;m<=3;m++){
    h+=`<div class="secT" style="margin:12px 0 6px"><span class="lbl">${m}개월차 · ${esc(MSHORT[m-1])}</span>
      <span class="cnt">${(m-1)*300+1}–${m*300}</span></div>`;
    for(let d=(m-1)*30+1;d<=m*30;d++){
      const lock=d>=nd, day=D.days[d-1];
      const label=day.theme||`Lesson ${voaFor(d).lesson} · ${voaFor(d).title}`;
      h+=`<button ${lock?"disabled":""} onclick="view.open=${open===d?null:d};render()"
          style="display:flex;width:100%;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);
                 text-align:left;opacity:${lock?.35:1};cursor:${lock?"default":"pointer"}">
        <span class="mono" style="font-size:11px;color:var(--text2);width:34px;flex:none">${d}일</span>
        <span style="flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</span>
        <span style="color:var(--text2);font-size:14px">${lock?"잠김":open===d?"−":"+"}</span></button>`;
      if(open===d&&!lock) h+=`<div style="padding:2px 0 10px">${day.words.map(card).join("")}</div>`;
    }
  }
  h+=`</div></div>`;
  app().innerHTML=h;
}

function copyBk(btn){
  const t=document.getElementById("bkOut");t.select();t.setSelectionRange(0,99999);
  const done=()=>{const o=btn.textContent;btn.textContent="복사됐습니다 — 메모앱에 붙여넣으세요";setTimeout(()=>btn.textContent=o,2200)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,()=>{try{document.execCommand("copy");done()}catch(e){}});
  else{try{document.execCommand("copy");done()}catch(e){}}
}
function doRestore(){
  const msg=document.getElementById("bkMsg"),v=document.getElementById("bkIn").value;
  try{importCode(v);msg.style.color="var(--jade)";msg.textContent="복원했습니다.";setTimeout(()=>go("map"),700)}
  catch(e){msg.style.color="var(--signal)";msg.textContent="복원하지 못했습니다 — "+e.message+". 코드 전체를 빠짐없이 붙여넣었는지 확인해 주세요."}
}
render();

</script>
